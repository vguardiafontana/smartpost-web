services:
  - type: web
    name: smartpost-web
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SMARTPOST_EPRESIS_USER
        sync: false
      - key: SMARTPOST_EPRESIS_PASSWORD
        sync: false
      - key: SMARTPOST_WEB_PIN
        sync: false
      - key: SMARTPOST_WEB_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SMARTPOST_DATA_DIR
        value: /tmp/smartpost-data
